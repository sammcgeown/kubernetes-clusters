apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-vso
  namespace: argocd
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: argocd
  namespace: argocd
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: dell7040-argocd       # the role from step 3
    serviceAccount: argocd-vso
    audiences:
      - "vault"
  vaultConnectionRef: vault-secrets-operator/default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-authentik
  namespace: argocd
spec:
  vaultAuthRef: argocd
  type: kv-v2
  mount: kv
  path: clusters/dell7040/argocd/authentik
  refreshAfter: 1h
  destination:
    name: argocd-authentik
    create: true
    labels:
      app.kubernetes.io/part-of: argocd   # without this, Argo CD won't read the Secret
  rolloutRestartTargets:
    - kind: Deployment
      name: argocd-dex-server  