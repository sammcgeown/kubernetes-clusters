apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes-agent-llm
  namespace: hermes-agent
spec:
  vaultAuthRef: hermes-agent
  type: kv-v2
  mount: kv
  # Keys: OPENROUTER_API_KEY
  path: clusters/dell7040/hermes-agent/llm
  refreshAfter: 1h
  destination:
    name: hermes-agent-llm
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hermes-agent
  hmacSecretData: true
