apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hermes-gateway
  namespace: hermes-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/hostname: hermes.lab.definit.co.uk
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      lb.cilium.io/pool: lab
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: hermes.lab.definit.co.uk
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: hermes-public-tls
