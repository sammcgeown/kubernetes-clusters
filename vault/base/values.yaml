global:
  enabled: true
  tlsDisable: true
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 256Mi
      cpu: 250m
injector:
  enabled: true
  agentImage:
    repository: hashicorp/vault
    tag: latest
server:
  ui:
    enabled: true
  extraSecretEnvironmentVars:
  - envName: VAULT_TOKEN
    secretName: vault-unseal-token
    secretKey: VAULT_TOKEN
  resources:
    requests:
      memory: 4Gi
      cpu: 400m
    limits:
      memory: 8Gi
      cpu: 800m
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  livenessProbe:
    enabled: true
    # haunhealthycode: don't kill standbys that temporarily can't reach the active node (default 474)
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204&haunhealthycode=204
    initialDelaySeconds: 120
  ha:
    enabled: true
    replicas: 3
    clusterAddr: http://$(HOSTNAME).vault-internal:8201
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        # Transit auto-unseal configuration
        seal "transit" {
          address = "https://truenas.lab.definit.co.uk:30504"
          tls_skip_verify = true
          mount_path = "transit"
          key_name = "dell7040-autounseal"
        }

        # Public address clients use
        api_addr = "https://vault.lab.definit.co.uk"
        # Pod address used for cluster traffic
        cluster_addr = "http://HOSTNAME.vault-internal.vault.svc:8201"

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"

          tls_disable     = 1
        }

        storage "raft" {
          path = "/vault/data"

          # Automatic joining with CA validation (no manual raft join required)
          retry_join {
            leader_api_addr       = "http://vault-0.vault-internal.vault.svc:8200"
          }
          retry_join {
            leader_api_addr       = "http://vault-1.vault-internal.vault.svc:8200"
          }
          retry_join {
            leader_api_addr       = "http://vault-2.vault-internal.vault.svc:8200"
          }
        }

        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    storageClass: longhorn
    size: 5Gi
    mountPath: /vault/data
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: true
    storageClass: longhorn
    size: 2Gi
    mountPath: /vault/audit
    accessMode: ReadWriteOnce
  ingress:
    enabled: false
  volumes:
    - name: plugins
      emptyDir: {}
  volumeMounts:
    - name: plugins
      mountPath: /usr/local/libexec/vault
      readOnly: false
  extraInitContainers:
    - name: fetch-github-plugin
      image: curlimages/curl:8.11.0
      securityContext:
        runAsUser: 100          # match the vault user so the files are owned correctly
        runAsGroup: 100
        allowPrivilegeEscalation: false
      command: [sh, -c]
      args:
        - |
          set -euo pipefail
          ver=v2.4.0
          asset=vault-plugin-secrets-github-linux-amd64
          digest=cd7b9ac7f765aeeddad2ad0483b37f8cc05eb37188fa23949987f3f7c02f83b2
          base=https://github.com/martinbaillie/vault-plugin-secrets-github/releases/download/${ver}

          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o /plugins/${asset} "${base}/${asset}"
          echo "${digest}  /plugins/${asset}" | sha256sum -c -
          cp /plugins/${asset} /plugins/vault-plugin-secrets-github
          chmod 0755 /plugins/vault-plugin-secrets-github
          rm -f /plugins/${asset}
      volumeMounts:
        - name: plugins
          mountPath: /plugins